name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lesson-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Install lesson audit dependencies
        run: python -m pip install numpy pandas

      - name: Audit coding lessons
        run: npm test
